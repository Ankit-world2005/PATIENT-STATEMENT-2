# Local development services only. Production uses managed PostgreSQL (RDS)
# and a BAA-covered email provider (see DOCS/02-trd.md).
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: mypatient
      POSTGRES_USER: mypatient
      POSTGRES_PASSWORD: mypatient_dev_only
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mypatient -d mypatient"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Catches every outgoing email (2-step codes, invitations, resets).
  # Inbox UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
